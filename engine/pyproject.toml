[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prismo-engine"
version = "0.1.0"
description = "Motor de áudio do Prismo: separação de faixas, análise musical, cifra, tablatura e partitura."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",
    "soundfile>=0.12",
    "music21>=9.1",
]

[project.optional-dependencies]
# Separação de faixas (precisa de PyTorch; GPU recomendada, CPU funciona mais devagar)
separacao = ["demucs>=4.0.1", "torch>=2.1,<2.9", "torchaudio>=2.1,<2.9"]
# Transcrição de áudio para notas (modelo do Spotify, roda em CPU)
transcricao = ["basic-pitch[onnx]>=0.4", "numpy<2"]
# Letra sincronizada a partir da voz isolada
letra = ["faster-whisper>=1.0"]
# Servidor HTTP que o site chama
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "httpx>=0.27"]
completo = ["prismo-engine[separacao,transcricao,letra,api]"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
prismo = "prismo_engine.cli:main"
prismo-api = "prismo_engine.api:main"

[tool.setuptools.packages.find]
include = ["prismo_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
